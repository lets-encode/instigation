# Apache for the production deployment (the config this project actually
# deploys; deploy/nginx.conf is the equivalent worked example for nginx). Two
# jobs:
#   1. Serve the static SPA (the `npm run build` output in ./build).
#   2. Reverse-proxy the Flask session broker (broker/), run e.g. with:
#      gunicorn -c gunicorn_config.py wsgi:app  (see broker/README.md).
#
# TLS is terminated upstream — at mdw by an F5 appliance in front of this host —
# so this vhost listens on plain HTTP and holds no certificate. The broker still
# marks its session cookie Secure: what matters is the scheme the *browser* used,
# not this hop.
#
# The broker MUST be served under the SAME origin as the SPA: it authenticates
# the SPA's API calls with an httpOnly session cookie, which has to be
# first-party. It is mounted twice — /auth/ (OAuth, the API relays) and
# /registry/ (the campaign name registry blueprint). The SPA's defaults
# (PUBLIC_BROKER_URL=/auth, PUBLIC_REGISTRY_URL=/registry) match, so no
# build-time var is needed. Set the broker's callback env accordingly:
#   REDIRECT_URL=https://your-domain.example/auth/authorize
# (also register that URL as the OAuth app's Callback URL).
#
# Needs: mod_proxy mod_proxy_http mod_headers mod_deflate mod_remoteip mod_dir
#
# The broker sees Apache as its client, so Flask must trust the forwarded
# headers or every request looks like it came from 127.0.0.1 — which would turn
# flask_limiter's default 20/s limit into one bucket shared by all users. app.py
# needs:  app.wsgi_app = ProxyFix(app.wsgi_app, x_for=1, x_proto=1)
#
# Change: server_name, RemoteIPTrustedProxy, the /registry/admin/ rule, and the
# DocumentRoot path.

<VirtualHost *:9305>
	# change me: the name the F5 forwards to.
	ServerName lets-encode.mdw.ac.at

	# Recover the real client IP from the upstream X-Forwarded-For, so the
	# access log, the Require rule below, and the header Apache passes on to the
	# broker all name the user rather than the appliance in front. The F5 must
	# have "Insert X-Forwarded-For" enabled on its HTTP profile — it is off by
	# default, and without it every request carries the F5's own address.
	# (Apache, unlike nginx, has no trailing line comments — the "change me"
	# markers below each sit on their own line.)
	RemoteIPHeader X-Forwarded-For
	# change me: the F5's self-IPs.
	RemoteIPTrustedProxy 193.171.88.226

	# ---------------------------------------------------------------- broker
	# ProxyPass is resolved during URI translation, ahead of the DocumentRoot
	# mapping and FallbackResource below, so these paths never reach the
	# filesystem and the SPA fallback cannot swallow them.

	# Pass the public hostname through, so the broker's logs and any
	# self-referential URL name the origin the browser actually used.
	ProxyPreserveHost On

	# Registry admin (list slugs, tombstone a name). The ADMIN_TOKEN bearer
	# check inside the broker is a dev fallback and defence in depth, not a
	# production auth system — institutional auth must be enforced HERE, before
	# requests reach the broker (e.g. mod_shib: AuthType shibboleth / Require
	# shib-session). Authorization runs for proxied requests too, so this needs
	# no ProxyPass of its own. LocationMatch rather than Location because
	# <Location "/registry/admin/"> would not match a request to
	# /registry/admin with no trailing slash.
	# <LocationMatch "^/registry/admin(/|$)">
		# change me
	#	Require ip 10.0.0.0/8
	# </LocationMatch>

	# Session broker (Flask). The trailing slash on both sides strips the /auth
	# prefix, so /auth/login → 127.0.0.1:7777/login, and likewise for
	# /authorize, /logout, the authenticated API relay under /proxy/, and the
	# IIIF relay at /iiif (which lets the wizard read any institution's IIIF
	# server same-origin, so neither CSP nor CORS blocks it).
	ProxyPass        /auth/ http://127.0.0.1:7777/
	ProxyPassReverse /auth/ http://127.0.0.1:7777/

	# Campaign name registry (a broker blueprint mounted at /registry, see
	# broker/registry.py). The path is passed through unchanged, matching the
	# blueprint's mount.
	ProxyPass        /registry/ http://127.0.0.1:7777/registry/
	ProxyPassReverse /registry/ http://127.0.0.1:7777/registry/

	# ------------------------------------------------------------ static SPA
	# change me: path to the `npm run build` output.
	DocumentRoot /opt/lets-encode/lets-encode/build

	# Apache's mime.types predates both of these, and the wrong type here fails
	# confusingly: the browser refuses to instantiate the Verovio wasm module or
	# to execute the pdf.js worker (see src/lib/prepare-images.ts).
	AddType application/wasm .wasm
	AddType text/javascript  .mjs

	# Nothing else in the chain compresses, and the score renderer and PDF
	# reader are megabytes of wasm and JS.
	AddOutputFilterByType DEFLATE text/html text/css text/javascript \
		application/javascript application/json image/svg+xml application/wasm

	<Directory /opt/lets-encode/lets-encode/build>
		Require all granted
		# FollowSymLinks so DocumentRoot can be a symlink into a releases/
		# directory, which makes a deployment an atomic symlink swap.
		Options -Indexes +FollowSymLinks

		# Serve real files as-is; send everything else to the SPA shell so
		# client-side routes (e.g. /<campaign>) resolve. One directive's worth
		# of nginx's `try_files $uri $uri/ /index.html`. Unknown paths answer
		# 200 with the shell, which is what adapter-static's fallback means.
		FallbackResource /index.html

		# The shell names hashed asset bundles, so it must always be
		# revalidated: a cached copy would point at files a later deployment has
		# already replaced. Matched by file rather than by URL, so it applies
		# however FallbackResource arrived here.
		<FilesMatch "\.html$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
	</Directory>

	# Filenames under _app/immutable are content-hashed, so their contents can
	# never change.
	<LocationMatch "^/_app/immutable/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
</VirtualHost>
