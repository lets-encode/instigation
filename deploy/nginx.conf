# nginx for the production deployment. Two jobs:
#   1. Serve the static SPA (the `npm run build` output in ./build).
#   2. TLS-terminate and reverse-proxy the Flask OAuth broker (broker/), run e.g.
#      with:  gunicorn --bind 127.0.0.1:8787 app:app   (see broker/README.md).
#
# The broker is served under the SAME origin as the SPA (here /oauth/), so the two
# are same-origin and CORS never comes into play. Set the SPA's build-time var:
#   PUBLIC_OAUTH_BROKER_URL=https://your-domain.example/oauth
# (To host the broker on a separate origin instead, drop the /oauth/ block, point
#  PUBLIC_OAUTH_BROKER_URL at that origin, and set the broker's ALLOWED_ORIGIN.)
#
# Change: server_name, the TLS cert paths, and the `root` path.

# Redirect HTTP → HTTPS.
server {
	listen 80;
	server_name your-domain.example;   # change me
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name your-domain.example;   # change me

	# TLS (e.g. issued by certbot / Let's Encrypt). change me
	ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

	# The static SPA. change me: path to the `npm run build` output.
	root /var/www/instigation/build;
	index index.html;

	# Serve real files as-is; send everything else to the SPA fallback so
	# client-side routes (e.g. /campaign/<owner>/<repo>) resolve.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# OAuth broker (Flask). The trailing slash on proxy_pass strips the /oauth
	# prefix, so /oauth/token → 127.0.0.1:8787/token and /oauth/revoke likewise.
	location /oauth/ {
		proxy_pass http://127.0.0.1:8787/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
