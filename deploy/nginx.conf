# nginx for the production deployment — a worked example for deployers running
# nginx. This project itself deploys behind Apache: see deploy/apache.conf, which
# does the same two jobs and is the config kept in step with the code. The two
# differ in one respect beyond syntax: here nginx also terminates TLS, whereas
# the Apache deployment sits behind an appliance that terminates it upstream.
#
# Two jobs:
#   1. Serve the static SPA (the `npm run build` output in ./build).
#   2. TLS-terminate and reverse-proxy the Flask session broker (broker/),
#      run e.g. with:  gunicorn -c gunicorn_config.py wsgi:app  (see broker/README.md).
#
# The broker MUST be served under the SAME origin as the SPA: it authenticates
# the SPA's API calls with an httpOnly session cookie, which has to be
# first-party. It is mounted twice — /auth/ (OAuth, the API relays) and
# /registry/ (the campaign name registry blueprint). The SPA's defaults
# (PUBLIC_BROKER_URL=/auth, PUBLIC_REGISTRY_URL=/registry) match, so no
# build-time var is needed. Set the broker's callback env accordingly:
#   REDIRECT_URL=https://your-domain.example/auth/authorize
# (also register that URL as the OAuth app's Callback URL).
#
# Change: server_name, the TLS cert paths, and the `root` path.

# Redirect HTTP → HTTPS.
server {
	listen 80;
	server_name your-domain.example;   # change me
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name your-domain.example;   # change me

	# TLS (e.g. issued by certbot / Let's Encrypt). change me
	ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

	# The static SPA. change me: path to the `npm run build` output.
	root /var/www/instigation/build;
	index index.html;

	# Serve real files as-is; send everything else to the SPA fallback so
	# client-side routes (e.g. /<campaign-name>) resolve.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Registry admin (list slugs, tombstone a name). The ADMIN_TOKEN bearer
	# check inside the broker is a dev fallback and defence in depth, not a
	# production auth system — institutional auth must be enforced HERE, before
	# requests reach the broker (e.g. auth_request / Shibboleth):
	location /registry/admin/ {
		# institutional auth module goes here                     # change me
		proxy_pass http://127.0.0.1:8787;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Campaign name registry (a broker blueprint mounted at /registry, see
	# broker/registry.py). No trailing slash on proxy_pass: the path is passed
	# through unchanged, matching the blueprint's mount.
	location /registry/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Session broker (Flask). The trailing slash on proxy_pass strips the
	# /auth prefix, so /auth/login → 127.0.0.1:8787/login, and likewise for
	# /authorize, /logout, the authenticated API relay under /proxy/, and the
	# IIIF relay at /iiif (which lets the wizard read any institution's IIIF
	# server same-origin, so neither CSP nor CORS blocks it).
	location /auth/ {
		proxy_pass http://127.0.0.1:8787/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# Optional short domain (e.g. letsenco.de): a path-preserving redirect and
# nothing else — the app never sees it. letsenco.de/ lands on the landing page
# and letsenco.de/<name> on the campaign, both by the same rule. Needs DNS for
# the short domain pointing here and a TLS cert for it.
