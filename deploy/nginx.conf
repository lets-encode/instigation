# nginx for the production deployment. Two jobs:
#   1. Serve the static SPA (the `npm run build` output in ./build).
#   2. TLS-terminate and reverse-proxy the Flask OAuth session broker (broker/),
#      run e.g. with:  gunicorn --bind 127.0.0.1:8787 app:app  (see broker/README.md).
#
# The broker MUST be served under the SAME origin as the SPA (here /oauth/): it
# authenticates the SPA's API calls with an httpOnly session cookie, which has to
# be first-party. The SPA's default PUBLIC_OAUTH_BROKER_URL is the /oauth path,
# so no build-time var is needed. Set the broker's callback env accordingly:
#   REDIRECT_URL=https://your-domain.example/oauth/authorize
# (also register that URL as the OAuth app's callback).
#
# Change: server_name, the TLS cert paths, and the `root` path.

# Redirect HTTP → HTTPS.
server {
	listen 80;
	server_name your-domain.example;   # change me
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name your-domain.example;   # change me

	# TLS (e.g. issued by certbot / Let's Encrypt). change me
	ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

	# The static SPA. change me: path to the `npm run build` output.
	root /var/www/instigation/build;
	index index.html;

	# Serve real files as-is; send everything else to the SPA fallback so
	# client-side routes (e.g. /campaign/<name>) resolve.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Slug registry (redirector, FastAPI). Same-origin mount so its calls need no
	# CORS. The trailing slash on proxy_pass strips the /registry prefix, so
	# /registry/register → 127.0.0.1:8000/register and /registry/api/slug/<name>
	# → 127.0.0.1:8000/api/slug/<name>. Run e.g.:
	#   uvicorn app.asgi:app --host 127.0.0.1 --port 8000  (see redirector/README.md)
	location /registry/ {
		proxy_pass http://127.0.0.1:8000/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# OAuth session broker (Flask). The trailing slash on proxy_pass strips the
	# /oauth prefix, so /oauth/login → 127.0.0.1:8787/login, and likewise for
	# /authorize, /logout, and the authenticated API relay under /proxy/.
	location /oauth/ {
		proxy_pass http://127.0.0.1:8787/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
