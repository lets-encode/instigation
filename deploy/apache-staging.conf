# Staging vhost — deployed from the `staging` branch by deploy/deploy.sh.
# deploy/apache.conf is the fully annotated production equivalent; this file
# differs only in ServerName, broker port (7778), and DocumentRoot. All three
# instances listen on the same port as name-based virtual hosts; the F5 must
# forward this hostname to the same backend.

<VirtualHost *:9305>
	ServerName staging.lets-encode.mdw.ac.at

	RemoteIPHeader X-Forwarded-For
	# change me: the F5's self-IPs.
	RemoteIPTrustedProxy 193.171.88.226

	# Security headers; TLS terminates at the F5, so HSTS must be set here
	# (see apache.conf).
	Header always set Strict-Transport-Security "max-age=31536000"
	Header always set X-Frame-Options "DENY"
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"

	# ---------------------------------------------------------------- broker
	ProxyPreserveHost On

	# Registry admin: enforce institutional auth here, before requests reach
	# the broker, and enable it together with ADMIN_ROUTES_ENABLED=1 in the
	# broker's environment (see apache.conf).
	# <LocationMatch "^/registry/admin(/|$)">
		# change me
	#	Require ip 10.0.0.0/8
	# </LocationMatch>

	ProxyPass        /auth/ http://127.0.0.1:7778/
	ProxyPassReverse /auth/ http://127.0.0.1:7778/

	ProxyPass        /registry/ http://127.0.0.1:7778/registry/
	ProxyPassReverse /registry/ http://127.0.0.1:7778/registry/

	# ------------------------------------------------------------ static SPA
	DocumentRoot /opt/lets-encode/staging/current

	AddType application/wasm .wasm
	AddType text/javascript  .mjs

	AddOutputFilterByType DEFLATE text/html text/css text/javascript \
		application/javascript application/json image/svg+xml application/wasm

	<Directory /opt/lets-encode/staging/current>
		Require all granted
		Options -Indexes +FollowSymLinks
		FallbackResource /spa.html
		<FilesMatch "\.html$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
	</Directory>

	<LocationMatch "^/_app/immutable/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
</VirtualHost>
